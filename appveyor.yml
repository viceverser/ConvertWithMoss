version: 1.0.{build}
image: Visual Studio 2022
build: off
test: off

install:
  - ps: |
      $ErrorActionPreference = 'Stop'
      $jdk = 'C:\Program Files\Java\jdk-25'
      if (-not (Test-Path (Join-Path $jdk 'bin\javac.exe'))) {
        $candidate = Get-ChildItem 'C:\Program Files\Java' -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '25' } | Select-Object -First 1
        if ($candidate) { $jdk = $candidate.FullName }
      }
      if (-not (Test-Path (Join-Path $jdk 'bin\javac.exe'))) {
        throw 'Java 25 JDK not present on build worker. Configure Java 25 installation before compiling.'
      }
      $env:JAVA_HOME = $jdk
      $env:PATH = (Join-Path $jdk 'bin') + ';' + $env:PATH
      javac -version

build_script:
  - ps: |
      $ErrorActionPreference = 'Stop'
      New-Item -ItemType Directory -Force -Path 'target\cue-checks' | Out-Null
      $sources = @(
        'src\main\java\de\mossgrabers\convertwithmoss\format\iso\image\CueMode1Image.java',
        'src\main\java\de\mossgrabers\convertwithmoss\format\iso\image\CueMode1Materializer.java',
        'src\test\java\de\mossgrabers\convertwithmoss\format\iso\image\CueMode1ImageTest.java',
        'src\test\java\de\mossgrabers\convertwithmoss\format\iso\image\CueMode1MaterializerTest.java'
      )
      & javac -d 'target\cue-checks' @sources
      if ($LASTEXITCODE -ne 0) { throw 'Compilation failed' }
      & java -ea -cp 'target\cue-checks' de.mossgrabers.convertwithmoss.format.iso.image.CueMode1ImageTest
      if ($LASTEXITCODE -ne 0) { throw 'Sector checks failed' }
      & java -ea -cp 'target\cue-checks' de.mossgrabers.convertwithmoss.format.iso.image.CueMode1MaterializerTest
      if ($LASTEXITCODE -ne 0) { throw 'Materializer checks failed' }

      Write-Host 'Compiling full ConvertWithMoss application using Maven...'
      # Maven/JDK warnings may arrive on stderr; do not let PowerShell
      # convert those warnings into terminating exceptions.
      $ErrorActionPreference = 'Continue'
      try {
        & mvn -B -ntp -DskipTests package
        $mavenExitCode = $LASTEXITCODE
      }
      finally {
        $ErrorActionPreference = 'Stop'
      }
      if ($mavenExitCode -ne 0) { throw "Full Maven application build failed (exit code $mavenExitCode)" }
      Write-Host 'Full ConvertWithMoss Maven package passed'

      # Publish a portable Windows test bundle, not an installer.
      # Preserve the Maven-produced JAR manifest and its dependency layout.
      $bundle = 'target\windows-test-bundle'
      New-Item -ItemType Directory -Force -Path (Join-Path $bundle 'lib') | Out-Null
      Copy-Item 'target\lib\*.jar' (Join-Path $bundle 'lib') -Force
      $launcherLines = @(
        '@echo off',
        'setlocal',
        'set "JAVA_EXE=java"',
        'if exist "%JAVA_HOME%\bin\java.exe" set "JAVA_EXE=%JAVA_HOME%\bin\java.exe"',
        '"%JAVA_EXE%" -version',
        '"%JAVA_EXE%" -jar "%~dp0lib\convertwithmoss-20.4.0.jar"',
        'if errorlevel 1 pause'
      )
      Set-Content -Path (Join-Path $bundle 'RUN.bat') -Value $launcherLines -Encoding ASCII
      Compress-Archive -Path (Join-Path $bundle '*') -DestinationPath 'target\ConvertWithMoss_BIN_CUE_Windows_Test.zip' -Force
      if (-not (Test-Path 'target\ConvertWithMoss_BIN_CUE_Windows_Test.zip')) { throw 'Portable ZIP was not created' }
      Push-AppveyorArtifact 'target\ConvertWithMoss_BIN_CUE_Windows_Test.zip' -FileName 'ConvertWithMoss_BIN_CUE_Windows_Test.zip'
      Write-Host 'Portable Windows test bundle uploaded as artifact'

artifacts:
  - path: target\ConvertWithMoss_BIN_CUE_Windows_Test.zip
    name: Windows BIN-CUE test bundle
